<div class="p">
<p>&nbsp;</p><div class="m1"><i>Tutte le nazioni sono invitate a lodare Dio Alleluia.</i></div><p eid="1654"></p><p sid="1655"></p><span class="v-num v-1">1&nbsp;</span><span class="v PS116_1" data-id="PS116_1">Lodate tutte il Signore, o nazioni, lodatelo tutti, o popoli;</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS116_2" data-id="PS116_2">perchè s'è affermata sopra di noi la sua misericordia e la verità del Signore rimane in eterno.</span>
