<p>&nbsp;</p><div class="m1"><i>Invito a lodare il Signore</i></div><p eid="1606"></p><p sid="1607"></p><span class="v-num v-1">1&nbsp;</span><span class="v PS117_1" data-id="PS117_1">Lodate l'Eterno, <i>voi</i> nazioni tutte! Celebratelo, <i>voi</i> popoli tutti!</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS117_2" data-id="PS117_2">Poiché grande è la sua misericordia verso di noi, e la fedeltà dell'Eterno dura per sempre. Alleluia.</span>
