<span class="v-num v-1">1&nbsp;</span><span class="v PS134_1" data-id="PS134_1">&lt;&lt;Cantico di Maalot.>><p eid="1442"></p><p sid="1443"></p>ECCO, benedite il Signore, <i>voi</i> tutti i servitori del Signore, Che state le notti nella Casa del Signore,</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS134_2" data-id="PS134_2">Alzate le vostre mani verso il santuario, E benedite il Signore.</span>

<span class="v-num v-3">3&nbsp;</span><span class="v PS134_3" data-id="PS134_3">Benedicati da Sion il Signore, Che ha fatto il cielo e la terra.</span>
