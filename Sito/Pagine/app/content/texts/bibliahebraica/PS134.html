<span class="v-num v-1">1&nbsp;</span><span class="v PS134_1" data-id="PS134_1">שִׁיר הַמַּעֲלֹות הִנֵּה ׀ בָּרֲכוּ אֶת־יְהוָה כָּל־עַבְדֵי יְהוָה הָעֹמְדִים בְּבֵית־יְהוָה בַּלֵּילֹות׃</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS134_2" data-id="PS134_2">שְׂאוּ־יְדֵכֶם קֹדֶשׁ וּבָרֲכוּ אֶת־יְהוָה׃</span>

<span class="v-num v-3">3&nbsp;</span><span class="v PS134_3" data-id="PS134_3">יְבָרֶכְךָ יְהוָה מִצִּיֹּון עֹשֵׂה שָׁמַיִם וָאָרֶץ׃</span>
