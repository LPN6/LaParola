<div class="c">Psalm 134</div>
<div class="p">
<span class="v-num v-1">1&nbsp;</span><span class="v PS134_1" data-id="PS134_1">A Song of Ascents. Look! Praise Yahweh, all you servants of Yahweh, Who stand by night in Yahweh's house!</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS134_2" data-id="PS134_2">Lift up your hands in the sanctuary. Praise Yahweh!</span>

<span class="v-num v-3">3&nbsp;</span><span class="v PS134_3" data-id="PS134_3">May Yahweh bless you from Zion; Even he who made heaven and earth.</span>

</div>
