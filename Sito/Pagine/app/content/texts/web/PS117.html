<div class="c">Psalm 117</div>
<div class="p">
<span class="v-num v-1">1&nbsp;</span><span class="v PS117_1" data-id="PS117_1">Praise Yahweh, all you nations! Extol him, all you peoples!</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS117_2" data-id="PS117_2">For his lovingkindness is great toward us. Yahweh's faithfulness endures forever. Praise Yah!</span>
