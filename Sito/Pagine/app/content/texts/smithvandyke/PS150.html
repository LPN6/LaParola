<div class="c">150</div>
<div class="p">
<span class="v-num v-1">1&nbsp;</span><span class="v PS150_1" data-id="PS150_1">.هللويا. سبحوا الله في قدسه. سبحوه في فلك قوته‎</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS150_2" data-id="PS150_2">.‎سبحوه على قواته سبحوه حسب كثرة عظمته‎</span>

<span class="v-num v-3">3&nbsp;</span><span class="v PS150_3" data-id="PS150_3">.‎سبحوه بصوت الصور سبحوه برباب وعود‎</span>

<span class="v-num v-4">4&nbsp;</span><span class="v PS150_4" data-id="PS150_4">.‎سبحوه بدف ورقص. سبحوه باوتار ومزمار‎</span>

<span class="v-num v-5">5&nbsp;</span><span class="v PS150_5" data-id="PS150_5">.‎سبحوه بصنوج التصويت سبحوه بصنوج الهتاف‎</span>

<span class="v-num v-6">6&nbsp;</span><span class="v PS150_6" data-id="PS150_6">‎كل نسمة فلتسبح الرب. هللويا</span>
