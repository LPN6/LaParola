<div class="c">Psalm 116</div>
<div class="p">
<span class="v-num v-1">1&nbsp;</span><span class="v PS116_1" data-id="PS116_1">O praise the Lord, all ye nations: praise him, all ye people.</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS116_2" data-id="PS116_2">For his mercy is confirmed upon us: and the truth of the Lord remaineth for ever.</span>
