<div class="c">134</div>
<div class="p">
<span class="v-num v-1">1&nbsp;</span><span class="v PS134_1" data-id="PS134_1">(Ein Lied im höhern Chor.) Siehe, lobet den HERRN, alle Knechte des HERRN, die ihr stehet des Nachts im Hause des HERRN!</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS134_2" data-id="PS134_2">Hebet eure Hände auf im Heiligtum und lobet den HERRN!</span>

<span class="v-num v-3">3&nbsp;</span><span class="v PS134_3" data-id="PS134_3">Der HERR segne dich aus Zion, der Himmel und Erde gemacht hat!</span>
