<div class="c">Psalm 117</div>
<div class="p">
<p>&nbsp;</p><div class="m1"><i>Let All Peoples Praise Yahweh</i></div><p eid="11190"></p><p sid="11191"></p><span class="v-num v-1">1&nbsp;</span><span class="v PS117_1" data-id="PS117_1">  Praise Yahweh, all you nations;<p eid="11191"></p><p sid="11192"></p>  extol him, all you peoples.<p eid="11192"></p><p sid="11193"></p></span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS117_2" data-id="PS117_2">  For his loyal love <i>is</i> mighty on our behalf,<p eid="11193"></p><p sid="11194"></p>  and the faithfulness of Yahweh <i>is</i> forever.<p eid="11194"></p><p sid="11195"></p>  Praise Yah!<p eid="11195"></p><p sid="11196"></p></span>
