<span class="v-num v-1">1&nbsp;</span><span class="v PS117_1" data-id="PS117_1">ALABAD á Jehová, naciones todas; Pueblos todos, alabadle.</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS117_2" data-id="PS117_2">Porque ha engrandecido sobre nosotros su misericordia; Y la verdad de Jehová es para siempre. Aleluya.</span>
