<div class="c">134</div>
<div class="p">
<span class="v-num v-1">1&nbsp;</span><span class="v PS134_1" data-id="PS134_1">MIRAD, bendecid á Jehová, Vosotros todos los siervos de Jehová, Los que en la casa de Jehová estáis por las noches.</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS134_2" data-id="PS134_2">Alzad vuestras manos al santuario, Y bendecid á Jehová.</span>

<span class="v-num v-3">3&nbsp;</span><span class="v PS134_3" data-id="PS134_3">Bendígate Jehová desde Sión, El cual ha hecho los cielos y la tierra.</span>
