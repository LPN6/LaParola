<div class="p">
<p>&nbsp;</p><div class="m1"><i>Le genti lodino Dio, che diede ad esse il Cristo.</i></div><p eid="834"></p><p sid="835"></p><span class="v-num v-1">1&nbsp;</span><span class="v PS116_1" data-id="PS116_1">Alleluia. Lodate Dio.<p eid="835"></p><p sid="836"></p>Quante voi siete, date laude al Signore: popoli tutti, lodatelo:</span>

<span class="v-num v-2">2&nbsp;</span><span class="v PS116_2" data-id="PS116_2">Imperocché la sua misericordia si è stabilita sopra di noi; e la verità del Signore è immutabile in eterno.</span>
