<div class="mt">Psalm 141</div>

<span class="v-num v-1">1&nbsp;</span><span class="v PS141_1" data-id="PS141_1"><span class="bibleref" data-id="PS141_001">Psa 141:1-10</span>. This Psalm evinces its authorship as the preceding, by its structure and the character of its contents. It is a prayer for deliverance from sins to which affliction tempted him, and from the enemies who caused it.<br><br></span>
